databases:
  - name: paylink-africa-demo-db
    plan: free
    region: frankfurt
    databaseName: paylink_africa_demo
    user: paylink_africa_demo

services:
  - type: web
    name: paylink-africa-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    dockerfilePath: ./backend-rust/Dockerfile
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: payment-links-api-rust
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: paylink-africa-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_COOKIE_MAX_AGE
        value: "43200"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: PAYMENT_GATEWAY
        value: MOCK
      - key: PAYMENT_CURRENCY
        value: NGN
      - key: UPSTREAM_API_URL
        value: http://127.0.0.1:4000
      - key: API_PUBLIC_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_FORMAT
        value: combined
      - key: LOG_LEVEL
        value: info
